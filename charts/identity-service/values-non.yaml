revisionHistoryLimit: 1

# Non only for now: prd keeps the base 10m until this has held a day idle and a
# paced load run here, then the value moves into values.yaml for both.
# At 10m the HPA scaled to 3 with no traffic. metrics-server never reports less
# than 1m, so an idle pod reads 10% however little it uses — cadvisor puts it
# at 0.15m median and 0.19m p99 over 7 days — and a sub-scrape blip of 16-24m
# was read as 160-240%. At 50m the floor reads 2% and that blip at most 48%, so
# scaling waits for load that holds near 40m, which leaves room for the bcrypt
# cost of a sign-in burst. Only the request moves; the map merges with the
# base, so memory and limits stay.
resources:
  requests:
    cpu: "50m"

image:
  # Tracks Chart.appVersion, like the older charts, now that the apps release
  # pipeline bumps it for this chart. Always rather than IfNotPresent because
  # non re-uses tags as builds land. The E2E gate depends on this: it waits
  # for the version the chart names, so a fixed pin here would let a release
  # pass the gate without ever reaching non.
  pullPolicy: Always

envs:
  # The same cluster, database and JDBC URL usersrole reads; the service parses
  # this form and rewrites it into the libpq URL its driver needs, so one value
  # feeds the JVM and both Go services through the cutover.
  UR_PG_DATASOURCE_URL: jdbc:postgresql://platform-postgresql-cluster-non-rw.database:5432/jdwlabs_non
  # The origin stamped into every token this service mints, and checked on the
  # way back in by all three services. It names the host the API is reached
  # through rather than this service's own name, because the routing change
  # puts these operations on that host under their own paths — a token minted
  # before the move must still verify after it.
  # The explicit :443 is deliberate. The JVM builds iss and aud from the
  # forwarded request URL, and the gateway forwards X-Forwarded-Port, so every
  # token it mints reads https://usersrole.non.jdwlabs.com:443. The Go
  # verifiers compare exactly; without the port they refuse every JVM token.
  ID_JWT_ISSUER_ORIGIN: https://usersrole.non.jdwlabs.com:443

externalSecrets:
  - refreshInterval: 1m
    secretStoreName: k8s-secret-store
    secretName: identity-service-pg-non
  - refreshInterval: 1m
    secretStoreName: vault
    secretName: identity-service-non

# The same underlying keys usersrole reads, not copies of them: the three
# services verify each other's tokens, so they have to share one signing secret
# and one database role. A second vault property would mint tokens the other
# two refuse.
envSecrets:
  - secretKey: UR_PG_USERNAME
    key: platform-postgresql-cluster-non-app
    property: username
    secretName: identity-service-pg-non
  - secretKey: UR_PG_PASSWORD
    key: platform-postgresql-cluster-non-app
    property: password
    secretName: identity-service-pg-non
  - secretKey: UR_JWT_SECRET_KEY
    key: usersrole
    property: jwt_key_non
    secretName: identity-service-non

# Reloader is installed on this cluster, so this is live rather than an opt-in
# waiting on it: a rotated signing key or database password restarts the pods
# instead of leaving them authenticating with a credential the store has
# already replaced.
deploymentAnnotations:
  secret.reloader.stakater.com/reload: "identity-service-pg-non,identity-service-non"

versionRoute:
  enabled: true
  host: identity-service.non.jdwlabs.com
