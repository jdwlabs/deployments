{{- /*
GET /actuator/info alone, on a hostname of this service's own, for the E2E
gate's version wait. It cannot live on the shared API host: /actuator/* there
belongs to the JVM's catch-all, and an Exact match here would take the JVM's
own version endpoint away from it. Every other path on this hostname is a 404
from the gateway.
*/ -}}
{{- if .Values.versionRoute.enabled }}
{{- $fullName := include "common.fullname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-version
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: platform-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - {{ required "versionRoute.host is required when versionRoute.enabled is true" .Values.versionRoute.host | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /actuator/info
          method: GET
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.port }}
{{- end }}
