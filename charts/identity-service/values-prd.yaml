# At 10m the HPA has no headroom over metrics-server's 1m floor: an idle pod
# reads 10% however little it uses, and a sub-scrape blip of 16-24m reads as
# 160-240%. Non scaled to 3 with no traffic that way and has held one replica
# at 50m. prd cadvisor puts this pod at 0.13m median and 0.25m p99 over 7
# days, so at 50m the floor reads 2% and scaling waits for load that holds
# near 40m, which leaves room for the bcrypt cost of a sign-in burst. Only the
# request moves; the map merges with the base, so memory and limits stay.
resources:
  requests:
    cpu: "50m"

image:
  # Pinned by index digest, the convention every prd overlay here follows: a
  # republished tag once left nodes serving a build older than the tag claimed,
  # under a pull policy that never re-checked. The digest makes the pull
  # deterministic whatever the tag later points at.
  tag: "0.0.3@sha256:55cfdba09d89033375348c1e05a019f3b25bc216cb9fd87b12b18a0b92c2ff7c"

envs:
  # The same cluster, database and JDBC URL usersrole reads; the service parses
  # this form and rewrites it into the libpq URL its driver needs, so one value
  # feeds the JVM and both Go services through the cutover.
  UR_PG_DATASOURCE_URL: jdbc:postgresql://platform-postgresql-cluster-prd-rw.database:5432/jdwlabs_prd
  # The origin stamped into every token this service mints, and checked on the
  # way back in by all three services. It names the host the API is reached
  # through rather than this service's own name, because the routing change
  # puts these operations on that host under their own paths — a token minted
  # before the move must still verify after it.
  # The explicit :443 is deliberate. The JVM builds iss and aud from the
  # forwarded request URL, and the gateway forwards X-Forwarded-Port, so every
  # token it mints reads https://usersrole.prd.jdwlabs.com:443. The Go
  # verifiers compare exactly; without the port they refuse every JVM token.
  ID_JWT_ISSUER_ORIGIN: https://usersrole.prd.jdwlabs.com:443

externalSecrets:
  - refreshInterval: 1m
    secretStoreName: k8s-secret-store
    secretName: identity-service-pg-prd
  - refreshInterval: 1m
    secretStoreName: vault
    secretName: identity-service-prd

# The same underlying keys usersrole reads, not copies of them: the three
# services verify each other's tokens, so they have to share one signing secret
# and one database role. A second vault property would mint tokens the other
# two refuse.
envSecrets:
  - secretKey: UR_PG_USERNAME
    key: platform-postgresql-cluster-prd-app
    property: username
    secretName: identity-service-pg-prd
  - secretKey: UR_PG_PASSWORD
    key: platform-postgresql-cluster-prd-app
    property: password
    secretName: identity-service-pg-prd
  - secretKey: UR_JWT_SECRET_KEY
    key: usersrole
    property: jwt_key_prd
    secretName: identity-service-prd

# Reloader is installed on this cluster, so this is live rather than an opt-in
# waiting on it: a rotated signing key or database password restarts the pods
# instead of leaving them authenticating with a credential the store has
# already replaced.
deploymentAnnotations:
  secret.reloader.stakater.com/reload: "identity-service-pg-prd,identity-service-prd"
