{{- /*
Raises the gateway's client body limit for this route only.

NGINX Gateway Fabric leaves nginx's own `client_max_body_size` default in place
(1m) and offers no per-route override through the HTTPRoute itself, so an upload
larger than that is rejected with a 413 at the gateway and never reaches the pod.
That 413 also carries no CORS headers, which is why a browser reports it as a
network failure rather than a size limit.

Lives in this chart rather than in `common` because only the two charts serving
icon uploads (this one and profile-service) need it, and NGF only honours a
policy sitting in the same namespace as its target — which the release
namespace already satisfies.

The size is checked here because NGF's CRD accepts at most four digits plus an
optional k, m or g. A value outside that renders fine and is then refused by the
API server at sync, which surfaces far from the change that caused it.
*/ -}}
{{- /* Tested for presence rather than truthiness: 0 is falsy, and to NGF it means "no limit", not "unset". */}}
{{- $rawSize := .Values.ingress.maxBodySize }}
{{- if and .Values.ingress.enabled (not (kindIs "invalid" $rawSize)) (ne (toString $rawSize) "") }}
{{- $maxBodySize := toString $rawSize }}
{{- if not (regexMatch "^[0-9]{1,4}[kmg]?$" $maxBodySize) }}
{{- fail (printf "ingress.maxBodySize must be up to four digits with an optional k, m or g suffix (e.g. 4m), got %q" $maxBodySize) }}
{{- end }}
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "common.fullname" . }}
  body:
    maxSize: {{ $maxBodySize | quote }}
{{- end }}
