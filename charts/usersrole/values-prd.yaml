image:
  tag: "1.0.5@sha256:f3992c11d3d4f9e07af160ecbe2e40c9a5baea2e9674f6da5fea4212ee53af76"

resources:
  requests:
    # Sized to roughly 2x steady-state (live ~216Mi) rather than the JVM's peak,
    # which the 2Gi limit absorbs. The startupProbe is what makes this safe: an
    # earlier trim without one let liveness kill pods mid-boot.
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1"

ingress:
  hosts:
    - host: usersrole.prd.jdwlabs.com

externalSecrets:
  - refreshInterval: 1m
    secretStoreName: k8s-secret-store
    secretName: usersrole-pg-prd
  - refreshInterval: 1m
    secretStoreName: vault
    secretName: usersrole-prd

envs:
  UR_PG_DATASOURCE_URL: jdbc:postgresql://platform-postgresql-cluster-prd-rw.database:5432/jdwlabs_prd
  UR_JWT_EXPIRATION_TIME_MS: "7200000"

envSecrets:
  - secretKey: UR_PG_USERNAME
    key: platform-postgresql-cluster-prd-app
    property: username
    secretName: usersrole-pg-prd
  - secretKey: UR_PG_PASSWORD
    key: platform-postgresql-cluster-prd-app
    property: password
    secretName: usersrole-pg-prd
  - secretKey: UR_JWT_SECRET_KEY
    key: usersrole
    property: jwt_key_prd
    secretName: usersrole-prd

# Opt-in for Reloader (installed via the platform repo's GitOps path, not
# yet live): comma-separated Secret names, matching the two envSecrets
# sources above. Inert until Reloader is installed.
deploymentAnnotations:
  secret.reloader.stakater.com/reload: "usersrole-pg-prd,usersrole-prd"
