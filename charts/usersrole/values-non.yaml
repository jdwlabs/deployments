revisionHistoryLimit: 1

image:
  # Always, not IfNotPresent: non re-uses tags as builds land, and a republished
  # tag otherwise leaves nodes serving whatever layer they cached first.
  pullPolicy: Always

# Memory request trimmed 1Gi -> 512Mi -> 448Mi: the seven-day p95 is 296Mi
# (max 298Mi). The HPA scales on 80% of the request, so 448Mi keeps utilisation
# near 66% and a replica from being added for the sake of a smaller request.
# Safe only because the startupProbe covers the slow JVM boot window — a prior
# trim without it let liveness kill pods mid-boot and cause a prod outage.
# The 2Gi limit is deliberately unchanged (boot-time spike allowance).
resources:
  requests:
    memory: "448Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1"

ingress:
  hosts:
    - host: usersrole.non.jdwlabs.com

externalSecrets:
  - refreshInterval: 1m
    secretStoreName: k8s-secret-store
    secretName: usersrole-pg-non
  - refreshInterval: 1m
    secretStoreName: vault
    secretName: usersrole-non

envs:
  UR_PG_DATASOURCE_URL: jdbc:postgresql://platform-postgresql-cluster-non-rw.database:5432/jdwlabs_non
  UR_JWT_EXPIRATION_TIME_MS: "7200000"

envSecrets:
  - secretKey: UR_PG_USERNAME
    key: platform-postgresql-cluster-non-app
    property: username
    secretName: usersrole-pg-non
  - secretKey: UR_PG_PASSWORD
    key: platform-postgresql-cluster-non-app
    property: password
    secretName: usersrole-pg-non
  - secretKey: UR_JWT_SECRET_KEY
    key: usersrole
    property: jwt_key_non
    secretName: usersrole-non

# Opt-in for Reloader (installed via the platform repo's GitOps path, not
# yet live): comma-separated Secret names, matching the two envSecrets
# sources above. Inert until Reloader is installed.
deploymentAnnotations:
  secret.reloader.stakater.com/reload: "usersrole-pg-non,usersrole-non"
