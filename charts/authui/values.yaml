# Only applied when autoscaling.enabled is false; while autoscaling is on the
# HPA owns the replica count and this value is ignored. Kept at 1 so turning
# autoscaling off never scales the workload to zero by accident.
replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

revisionHistoryLimit: 2

image:
  repository: jdwlabs/authui
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# uid 101 is the image's own nginx user, given numerically because
# runAsNonRoot cannot verify a name and would fail the container at admission.
# The uid stays below the KSV-0020 floor deliberately: these pods share no UID
# namespace with the host, and the image owns its document root at 101.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem is absent on purpose: the entrypoint rewrites the built
# bundles under the document root at start-up to inject runtime config, and a
# read-only root makes the container exit 1 before nginx starts.
securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# 8080, not 80: the shared scaffold derives the container port from this value,
# and the serving user cannot bind a privileged port with all capabilities dropped.
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  gateway:
    name: platform-gateway
    namespace: nginx-gateway
    sectionName: https
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: authui.default.jdwlabs.com

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

envs:
  ENVIRONMENT: default
  AUTH_BASE_URL: https://usersrole.default.jdwlabs.com

envSecrets: []