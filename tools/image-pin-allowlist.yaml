# Documented exceptions to tools/check-image-pins.py's digest-pin requirement.
#
# Every entry MUST carry a non-empty `reason` explaining why the exception is
# deliberate. An entry that no longer matches an actual unpinned reference is
# treated as stale and fails the check — remove it once the file is fixed or
# no longer exists.
#
# `path` is repo-relative; `ref` is the FULL reference the checker composes
# for that location after values.yaml and the overlay are merged, tag included
# (e.g. `jdwlabs/authui:2.0.22`) — together they are the unique key. A bare
# repository means "no tag set, falls back to Chart.appVersion". The tag is
# part of the key on purpose: a path-only key would keep excusing whatever
# that file's image block later turned into — swapping the repository, or
# replacing an empty tag with `latest`, would inherit an exemption written
# about a different reference, and the reason text would quietly stop being
# true. Keying on the reference itself makes an exception expire the moment
# what it excused changes, and the stale-entry check then forces the leftover
# row out.
#
# Malformed references (digest-only tags, unquoted numeric tags) are NOT
# allowlistable — no reason makes an unresolvable reference correct.
exceptions:
  - path: charts/authui/values-non.yaml
    ref: jdwlabs/authui
    reason: >-
      non intentionally tracks Chart.appVersion under imagePullPolicy: Always
      rather than a digest pin, so a new build reaches the environment without
      a promotion PR. This is a deliberate rapid-iteration tradeoff for a
      non-production environment, not an oversight — see the inline comment
      in this file for the incident that motivated the Always pull policy.

  - path: charts/container/values-non.yaml
    ref: jdwlabs/container
    reason: >-
      non intentionally tracks Chart.appVersion under imagePullPolicy: Always
      rather than a digest pin, so a new build reaches the environment without
      a promotion PR. This is a deliberate rapid-iteration tradeoff for a
      non-production environment, not an oversight — see the inline comment
      in this file for the incident that motivated the Always pull policy.

  - path: charts/rolesui/values-non.yaml
    ref: jdwlabs/rolesui
    reason: >-
      non intentionally tracks Chart.appVersion under imagePullPolicy: Always
      rather than a digest pin, so a new build reaches the environment without
      a promotion PR. This chart's overlay even sets image.tag explicitly to
      "" to make that fallback obvious. Deliberate rapid-iteration tradeoff
      for a non-production environment, not an oversight.

  - path: charts/servicediscovery/values-non.yaml
    ref: jdwlabs/servicediscovery
    reason: >-
      non intentionally tracks Chart.appVersion under imagePullPolicy: Always
      rather than a digest pin, so a new build reaches the environment without
      a promotion PR. This is the same class of reference that caused the
      servicediscovery outage in prd, but here it is a deliberate,
      documented tradeoff (see this file's inline comment) rather than an
      accident — prd itself is digest-pinned.

  - path: charts/usersrole/values-non.yaml
    ref: jdwlabs/usersrole
    reason: >-
      non intentionally tracks Chart.appVersion under imagePullPolicy: Always
      rather than a digest pin, so a new build reaches the environment without
      a promotion PR. Deliberate rapid-iteration tradeoff for a
      non-production environment, not an oversight.

  - path: charts/usersui/values-non.yaml
    ref: jdwlabs/usersui
    reason: >-
      non intentionally tracks Chart.appVersion under imagePullPolicy: Always
      rather than a digest pin, so a new build reaches the environment without
      a promotion PR. Deliberate rapid-iteration tradeoff for a
      non-production environment, not an oversight.

  - path: charts/common/templates/_test-connection.yaml
    ref: busybox
    reason: >-
      Helm `test` hook, not a workload. Helm only materialises it on an
      explicit `helm test`, and ArgoCD — which is the only thing that applies
      these charts — does not create it during sync: all six app charts run in
      both environments and no `-test-connection` Pod exists anywhere in the
      cluster. The failure mode this check exists to stop therefore cannot
      occur here: nothing pulls this reference on the delivery path, and an
      implicit `:latest` makes Kubernetes default imagePullPolicy to Always,
      so even a manual `helm test` re-pulls rather than serving a stale cached
      layer. A digest pin would be strictly worse — Renovate is scoped to
      GitHub Actions and Chart.yaml dependencies here, so a pinned busybox in
      a chart template would freeze at whatever CVEs it shipped with and
      nothing would ever bump it. Revisit if this Pod ever gains a non-test
      hook annotation or the image starts carrying real diagnostic tooling.
