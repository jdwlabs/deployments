name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Every job here only reads the tree; nothing writes back to the repo.
permissions:
  contents: read

# Cancel superseded PR runs; a main-push always runs the gates to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Build chart dependencies
        run: |
          for chart in charts/*/; do
            helm dependency build "$chart"
          done

      - name: Lint charts
        run: |
          for chart in charts/*/; do
            echo "linting $chart..."
            helm lint "$chart"
          done

  template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Build chart dependencies
        run: |
          for chart in charts/*/; do
            helm dependency build "$chart"
          done

      - name: Template charts with each environment values
        run: |
          # Every values-<env>.yaml, discovered rather than listed: a
          # hard-coded env list leaves any new overlay unrendered and reading
          # as passing.
          for chart in charts/*/; do
            name=$(basename "$chart")
            for values_file in "$chart"values-*.yaml; do
              [ -f "$values_file" ] || continue
              echo "Templating $name with $(basename "$values_file")..."
              helm template "$name" "$chart" -f "$chart/values.yaml" -f "$values_file" > /dev/null
            done
          done

  image-pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install PyYAML
      - name: Unit-test the image-pin check
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Reject mutable image references
        run: python3 tools/check-image-pins.py

  promotion-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Shellcheck the digest resolver
        run: shellcheck -x tools/resolve-image-digest.sh tools/tests/test-resolve-image-digest.sh
      # Offline only: the network assertions resolve real tags against Docker
      # Hub anonymously, and shared runner egress IPs hit the anonymous rate
      # limit unpredictably. Run them locally (drop the env var) when changing
      # the resolver; the promotion workflow exercises the live path for real.
      - name: Digest resolver tests
        env:
          RESOLVE_DIGEST_TESTS_OFFLINE: "1"
        run: bash tools/tests/test-resolve-image-digest.sh
      - name: Shellcheck the allowlist parser
        run: shellcheck -x tools/parse-prd-auto-promote.sh tools/tests/test-parse-prd-auto-promote.sh
      - name: Allowlist parser tests
        run: bash tools/tests/test-parse-prd-auto-promote.sh

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate ArgoCD config files
        run: |
          exit_code=0
          for config in argocd/*/config.yaml; do
            env=$(basename "$(dirname "$config")")
            echo "Validating $config..."

            # Check required fields exist for each app entry
            apps=$(yq '.apps | length' "$config")
            for i in $(seq 0 $(( apps - 1))); do
              name=$(yq ".apps[$i].name" "$config")
              ns=$(yq ".apps[$i].namespace" "$config")
              chart_path=$(yq ".apps[$i].chartPath" "$config")

              if [ "$name" = "null" ] || [ -z "$name" ]; then
                echo "  ERROR: apps[$i] missing 'name'"
                exit_code=1
              fi

              if [ "$ns" = "null" ] || [ -z "$ns" ]; then
                echo "  ERROR: apps[$i] ($name) missing 'namespace'"
                exit_code=1
              fi

              if [ "$chart_path" = "null" ] || [ -z "$chart_path" ]; then
                echo "  ERROR: apps[$i] ($name) missing 'chartPath'"
                exit_code=1
              elif [ ! -d "$chart_path" ]; then
                echo "  ERROR: apps[$i] ($name) chartPath '$chart_path' does not exist"
                exit_code=1
              fi

              # Check that referenced value files exist
              value_files=$(yq ".apps[$i].valueFiles | length" "$config")
              for j in $(seq 0 $(( value_files - 1 ))); do
                vf=$(yq ".apps[$i].valueFiles[$j]" "$config")
                if [ ! -f "$chart_path/$vf" ]; then
                  echo "  ERROR: apps[$i] ($name) valueFile '$chart_path/$vf' does not exist"
                  exit_code=1
                fi
              done
            done

            echo "  $apps apps validated"
          done
          exit $exit_code
