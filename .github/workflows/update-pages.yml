name: Update Chart Index Page

on:
  workflow_run:
    workflows: ["Release Chart"]
    types: [completed]

permissions:
  contents: write

# Shares its group with Release Chart: both push to gh-pages, and two Release
# Chart runs completing close together (batch-releasing more than one chart)
# would otherwise trigger two of these in parallel, each checking out
# gh-pages, editing index.html, and pushing. The reusable job's `git push`
# has no `|| true` and runs under Actions' default `bash -eo pipefail`, so a
# racing non-fast-forward rejection fails this job loudly (red run), not
# silently.
#
# KNOWN LIMITATION - see the fuller note in release.yml: cancel-in-progress:
# false holds one pending run per group, not an unbounded queue. A 3rd
# concurrent entrant across the two workflows sharing this group cancels the
# previously-pending run instead of queuing behind it, and a `cancelled`
# conclusion reads as success to anything matching only on `failure` - the
# same class of problem prd-drift.yml documents for promote-prd.yml. This
# group narrows the race window, it does not close it for 3+ concurrent
# writers.
concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  update-index:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: jdwlabs/.github/.github/workflows/update-pages.yml@b827924589b7e129a81762131b9d451121718bdc  # main as of 2026-08-26 (jdwlabs/.github has no tagged releases)
    permissions:
      contents: write
    # With this repo's Release App credentials present, the reusable job
    # pushes under a minted App token scoped to this repo and commits as
    # jdwlabs-release-bot[bot] - the same identity the release pipeline
    # uses - instead of github-actions[bot] via GITHUB_TOKEN.
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
