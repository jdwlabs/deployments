name: Promote PRD

# Opens a reviewed pull request that bumps image.tag in a chart's
# values-prd.yaml. prd image tags change ONLY through pull requests opened by
# this workflow - never by hand-edits and never by direct pushes. The commit
# is created through the GitHub contents API so it is signed and, when App
# credentials are configured, authored by the bot App (whose PRs trigger CI).
#
# Triggers:
# - workflow_run on E2E: after a passing E2E run against non, every chart
#   listed in .github/prd-auto-promote whose appVersion differs from the
#   pinned prd tag gets a promotion PR.
#
#   This path is dormant, and it is switched off upstream rather than
#   miswired here. A workflow_run trigger only ever resolves workflow names
#   within this same repository, and E2E is this repo's own .github/workflows/
#   e2e.yml - it is not a cross-repo reference to the apps pipeline. E2E is
#   manual-only while the self-hosted ARC runner it needs is dormant (see the
#   header of e2e.yml), so no E2E run completes and there is nothing for this
#   trigger to observe. Restoring auto-promotion is an ARC/E2E task; leave the
#   trigger as-is so it resumes when E2E does.
# - workflow_dispatch: promote a single chart on demand, optionally to an
#   explicit tag (defaults to the chart's current appVersion). The only path
#   in use today.
#
# Whichever path supplies the tag, prd is only ever pinned to
# <tag>@sha256:<index digest>: a bare tag is resolved against the registry
# first, and a promotion that cannot be resolved fails instead of falling back
# to the mutable tag. An explicitly dispatched tag that already carries a
# digest is used exactly as given.
#
# See docs/prd-promotion.md for the full contract and runbook.

on:
  workflow_run:
    workflows:
      - E2E
    types:
      - completed
  workflow_dispatch:
    inputs:
      app:
        description: 'Chart directory name under charts/ (e.g. rolesui)'
        required: true
        type: string
      tag:
        description: 'Image tag to promote prd to (defaults to the chart appVersion). A bare tag is resolved to its index digest; pass tag@sha256:<digest> to pin an exact one.'
        required: false
        type: string
        default: ''

permissions: {}

# Serialize promotion runs so two runs never race on the same promotion branch.
concurrency:
  group: promote-prd
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Fallback path only: when App credentials are absent the default token
      # pushes the promotion branch and opens the PR (without triggering CI).
      contents: write
      pull-requests: write
    steps:
      - name: Check for promotion bot credentials
        id: creds
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: |
          if [ -n "${APP_ID}" ]; then
            echo "has-app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-app=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY secrets are not configured. Falling back to GITHUB_TOKEN - PRs opened this way do NOT trigger CI automatically; run the CI workflow manually against the promotion branch."
          fi

      - name: Generate promotion bot token
        id: bot-token
        if: ${{ steps.creds.outputs.has-app == 'true' }}
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # The App is installed org-wide, so omitting owner/repositories mints
          # a token valid across every repo in the org. Scope it to this repo
          # and to the two permissions the steps below actually use: the git
          # refs/contents API calls, and gh pr list/create.
          owner: ${{ github.repository_owner }}
          repositories: deployments
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Determine promotion candidates
        id: candidates
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Chart-name validation (valid_app) and the .github/prd-auto-promote
          # parsing it gates live in tools/parse-prd-auto-promote.sh so the
          # CRLF-handling and the "fail loud, not a warning" behaviour are
          # covered by tools/tests/test-parse-prd-auto-promote.sh rather than
          # only exercised through this dormant trigger.
          # shellcheck source=/dev/null
          source tools/parse-prd-auto-promote.sh

          chart_app_version() {
            sed -n 's/^appVersion:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' "charts/$1/Chart.yaml" | head -1
          }

          # Both values flow into file paths, git refs, sed replacements and PR
          # text, so they are validated before any use: chart names as the
          # lowercase-alphanumeric-and-hyphen directory convention (valid_app,
          # sourced above), tags as the Docker image tag grammar (rules out sed
          # metacharacters entirely).
          # An optional @sha256:<64 hex> suffix is accepted so a promotion can
          # pin content rather than a mutable tag. Docker Hub tags are mutable
          # and have been overwritten here before, leaving warm nodes serving a
          # build the tag no longer points at; the digest form is the only
          # reference that survives that. The added characters are still
          # sed-safe -- ':' and '@' are not sed metacharacters, and the hex is
          # anchored to exactly 64 lowercase digits.
          valid_tag() {
            [[ "$1" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}(@sha256:[a-f0-9]{64})?$ ]]
          }

          # Helm's own override rule for the image map: a key set in the prd
          # overlay wins, otherwise the chart's base values.yaml supplies it.
          image_repository() {
            sed -n '/^image:/,/^[^[:space:]]/ s/^  repository:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' "$1" | head -1
          }
          effective_repository() {
            local repo
            repo=$(image_repository "charts/$1/values-prd.yaml")
            [ -n "$repo" ] || repo=$(image_repository "charts/$1/values.yaml")
            printf '%s' "$repo"
          }

          # Turns a bare tag into the only reference prd is allowed to pin:
          # <tag>@sha256:<index digest>. A bare tag is mutable - republishing it
          # changes what a node pulls next, and under IfNotPresent already-warm
          # nodes keep serving the old build while every probe stays green.
          #
          # A tag that already carries a digest is passed through untouched. It
          # was chosen deliberately (a rollback pins a digest the tag no longer
          # points at), so re-resolving it would silently move the pin.
          pin_reference() {
            local app="$1" tag="$2" repo digest
            case "$tag" in
              *@sha256:*) printf '%s' "$tag"; return 0 ;;
            esac
            repo=$(effective_repository "$app")
            if [ -z "$repo" ]; then
              echo "::error::[${app}] neither charts/${app}/values-prd.yaml nor charts/${app}/values.yaml sets image.repository, so '${tag}' cannot be resolved to a digest." >&2
              return 1
            fi
            digest=$(bash tools/resolve-image-digest.sh "$repo" "$tag") || return 1
            printf '%s@%s' "$tag" "$digest"
          }

          : > candidates.txt
          unresolved=0
          allowlist_invalid=0
          if [ "$EVENT" = "workflow_dispatch" ]; then
            app="$INPUT_APP"
            if ! valid_app "$app"; then
              echo "::error::invalid app '${app}' - chart names are lowercase alphanumerics and hyphens."
              exit 1
            fi
            if [ ! -f "charts/${app}/values-prd.yaml" ]; then
              echo "::error::charts/${app}/values-prd.yaml not found - '${app}' is not a promotable chart."
              exit 1
            fi
            tag="${INPUT_TAG:-$(chart_app_version "$app")}"
            if [ -z "$tag" ]; then
              echo "::error::no tag was provided and charts/${app}/Chart.yaml has no appVersion."
              exit 1
            fi
            if ! valid_tag "$tag"; then
              echo "::error::invalid tag '${tag}' - not a valid image tag."
              exit 1
            fi
            if ! ref=$(pin_reference "$app" "$tag"); then
              echo "::error::[${app}] could not resolve '${tag}' to an image index digest, so there is nothing safe to promote. prd pins digests, never bare tags - see docs/prd-promotion.md. Re-run once the tag is published and the registry is reachable, or dispatch with an explicit -f tag='<tag>@sha256:<index digest>'."
              exit 1
            fi
            echo "$app $ref" >> candidates.txt
          else
            allowlist=$(parse_allowlist .github/prd-auto-promote) || allowlist_invalid=1
            if [ -z "$allowlist" ] && [ "$allowlist_invalid" -eq 0 ]; then
              echo "No charts are enabled for automatic prd promotion (.github/prd-auto-promote has no entries). Nothing to do."
            fi
            for app in $allowlist; do
              if [ ! -f "charts/${app}/values-prd.yaml" ]; then
                echo "::warning::allowlisted chart '${app}' has no values-prd.yaml; skipping."
                continue
              fi
              tag=$(chart_app_version "$app")
              if [ -z "$tag" ]; then
                echo "::warning::charts/${app}/Chart.yaml has no appVersion; skipping."
                continue
              fi
              if ! valid_tag "$tag"; then
                echo "::warning::charts/${app}/Chart.yaml appVersion '${tag}' is not a valid image tag; skipping."
                continue
              fi
              # Unlike the skips above, an unresolvable digest is an error, not
              # a warning: the chart is enabled for promotion and its tag exists
              # in the chart, so silence here would look like "nothing to
              # promote" while auto-promotion was in fact broken. Remaining
              # charts are still processed so one run surfaces every problem,
              # then the run fails.
              if ! ref=$(pin_reference "$app" "$tag"); then
                echo "::error::[${app}] could not resolve appVersion '${tag}' to an image index digest; skipping this chart and failing the run. prd pins digests, never bare tags - see docs/prd-promotion.md."
                unresolved=$((unresolved + 1))
                continue
              fi
              echo "$app $ref" >> candidates.txt
            done
          fi
          echo "Promotion candidates:"
          cat candidates.txt || true

          # Last line of defence, re-checking what actually reaches the next
          # step rather than trusting the branch that produced it. A bare tag
          # here would open a PR that cannot merge (the image-pin check rejects
          # mutable references) and, were it merged anyway, would hand prd a
          # reference whose content can change underneath it.
          while read -r app ref; do
            [ -z "$app" ] && continue
            if ! valid_tag "$ref"; then
              echo "::error::[${app}] candidate '${ref}' is not a valid image reference; refusing to open a promotion PR."
              exit 1
            fi
            case "$ref" in
              *@sha256:*) ;;
              *)
                echo "::error::[${app}] candidate '${ref}' is not digest-pinned; refusing to open a promotion PR."
                exit 1 ;;
            esac
          done < candidates.txt

          if [ "$unresolved" -ne 0 ]; then
            echo "::error::${unresolved} allowlisted chart(s) could not be resolved to an image index digest; failing rather than promoting a mutable tag."
            exit 1
          fi

          if [ "$allowlist_invalid" -ne 0 ]; then
            echo "::error::.github/prd-auto-promote contains an entry that failed chart-name validation (see ::error:: above); failing rather than silently skipping it."
            exit 1
          fi

      - name: Open promotion pull requests
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          TRIGGER_URL: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          TRIGGER_DESC: ${{ github.event_name == 'workflow_run' && 'passing E2E run against non' || format('manual dispatch by @{0}', github.actor) }}
        run: |
          # Anchored to the two-space indent so only the direct child of the
          # top-level image block matches, never a nested tag key.
          prd_tag() {
            sed -n '/^image:/,/^[^[:space:]]/ s/^  tag:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' "charts/$1/values-prd.yaml" | head -1
          }

          main_sha=$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)

          while read -r app tag; do
            [ -z "$app" ] && continue
            file="charts/${app}/values-prd.yaml"
            current=$(prd_tag "$app")

            if [ "$current" = "$tag" ]; then
              echo "[${app}] prd already pins ${tag}; nothing to promote."
              continue
            fi

            branch="chore/promote-${app}-prd"

            # Always rebuild the promotion branch from the current main tip so
            # each PR is a clean single-commit diff and reruns are idempotent.
            if gh api "repos/${REPO}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api -X PATCH "repos/${REPO}/git/refs/heads/${branch}" \
                -f sha="$main_sha" -F force=true >/dev/null
            else
              gh api -X POST "repos/${REPO}/git/refs" \
                -f ref="refs/heads/${branch}" -f sha="$main_sha" >/dev/null
            fi

            # Change ONLY the image.tag line: the direct (two-space indented)
            # child of the top-level image block. The reference was validated
            # against the Docker tag grammar plus an anchored 64-hex digest
            # suffix, so it cannot carry sed metacharacters into the
            # replacement.
            cp "$file" /tmp/values-prd-before.yaml
            sed -i "/^image:/,/^[^[:space:]]/ s|^\(  tag:[[:space:]]*\).*|\1\"${tag}\"|" "$file"
            removed=$(diff /tmp/values-prd-before.yaml "$file" | grep '^<' || true)
            changed=$(printf '%s\n' "$removed" | grep -c '^<' || true)
            if [ "$changed" -ne 1 ] || ! printf '%s\n' "$removed" | grep -q '^<   tag:'; then
              echo "::error::[${app}] expected exactly one changed line (the image tag) in ${file}, got ${changed}; skipping this chart."
              git checkout -- "$file"
              continue
            fi

            # Commit through the contents API: the commit is created server-side,
            # signed by GitHub, and authored by the bot identity behind GH_TOKEN.
            file_sha=$(gh api "repos/${REPO}/contents/${file}?ref=${branch}" --jq .sha)
            gh api -X PUT "repos/${REPO}/contents/${file}" \
              -f message="chore(${app}): promote prd image tag to ${tag}" \
              -f branch="${branch}" \
              -f sha="${file_sha}" \
              -f content="$(base64 -w0 "$file")" >/dev/null
            git checkout -- "$file"
            echo "[${app}] pushed promotion commit ${current} -> ${tag} on ${branch}."

            existing=$(gh pr list -R "$REPO" --head "$branch" --state open --json number --jq length)
            if [ "$existing" -gt 0 ]; then
              echo "[${app}] promotion PR already open for ${branch}; branch updated in place."
              continue
            fi

            # The "CI is green" line below names required-check job contexts
            # ("lint", "template", "validate-config") as literal text — keep
            # it in lockstep with any rename/merge/removal of those jobs and
            # with .github/rulesets/baseline.json (see that ruleset's
            # apply.sh for the required-check rename procedure).
            cat > /tmp/pr-body.md <<EOF
          Automated prd promotion proposal opened by the Promote PRD workflow.

          | | |
          |---|---|
          | Chart | \`charts/${app}\` |
          | prd image tag | \`${current}\` -> \`${tag}\` |
          | Trigger | ${TRIGGER_DESC} (${TRIGGER_URL}) |

          This PR changes **only** \`image.tag\` in \`charts/${app}/values-prd.yaml\`.
          Chart.yaml (\`version\`, \`appVersion\`) is untouched by design - see
          docs/prd-promotion.md for the versioning contract.

          ## Reviewer checklist

          - [ ] The target tag's image is verified to supersede the currently pinned image (two release generations may coexist; a numerically newer-looking tag is not proof).
          - [ ] The digest is the tag's manifest **index** digest, as resolved in this run's log - not a per-architecture child digest, which would read as drift against every other tool.
          - [ ] CI is green: lint, template (values-prd stack renders), validate-config.
          - [ ] Rollback plan understood: revert this PR to re-pin \`${current}\`; ArgoCD syncs the revert like any other merge.

          Merging this PR causes ArgoCD to sync prd to the new tag automatically.
          EOF

            gh pr create -R "$REPO" --base main --head "$branch" \
              --title "chore(${app}): promote prd image tag to ${tag}" \
              --body-file /tmp/pr-body.md
          done < candidates.txt
