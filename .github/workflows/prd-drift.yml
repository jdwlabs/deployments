name: prd Drift

# Reports charts whose released appVersion never reached values-prd.yaml.
#
# Promotion to prd is a deliberate code-owner review and its automatic trigger
# is dormant while E2E is manual-only, so a release reaching non and never
# reaching prd is an expected intermediate state — and an indefinite one, with
# nothing anywhere that ends it. Every signal on the release path stays green
# while the gap widens, because none of them touch prd. This job is the missing
# half: it does not promote anything, it says how far behind prd is and for how
# long.
#
# Deliberately not a pull-request check. The distance between a chart's
# appVersion and its prd pin is a property of main, not of a branch, so gating
# pull requests on it would block every unrelated change for a gap that change
# did not cause and cannot close — and a check whose subject is not the diff in
# front of it is one people learn to merge past.
#
# Repository state is the subject on purpose. The obvious alternative — reading
# the conclusions of Promote PRD runs — has to decide what `cancelled` means,
# and promotion runs are cancelled in ordinary operation: they share one
# serialised concurrency group that holds a single pending run, so dispatching
# several at once cancels all but two. A `cancelled` conclusion reads as
# success to anything matching only on `failure`, which is precisely how a
# missed promotion would hide again.
#
# The job still goes red on a finding, and that red still means something. What
# it never had was an audience: a scheduled workflow reports to the Actions tab,
# no review blocks on it, and nothing tells anyone it turned. It ran red for a
# fortnight over a real gap without reaching a person. So each run now also
# posts to Alertmanager, and which receiver hears it says what kind of trouble
# this is:
#
#   * a finding — prd is behind — goes out as `severity: warning` with no
#     tenant label, which the route tree sends to the AI-SRE relay alone.
#     Promotion backlog is work to be triaged, not a page, and it stands for as
#     long as it takes someone to dispatch the promotions. Sending that to
#     Discord daily would either nag until it is filtered, or — worse — post a
#     "resolved" line minutes later when Alertmanager expires the alert, which
#     reads as the gap having closed when nothing has moved.
#   * no verdict at all — the checker crashed, or never ran — goes out as
#     `severity: critical`, reaching Discord as well as the relay. That is the
#     condition nothing else can report, because a check that cannot run cannot
#     tell you what it did not find, and it is rare enough to be worth a page.
#
# Two gaps this deliberately does not cover, both of which need a rule beside
# the cluster's other Prometheus rules rather than a step inside the job that
# has stopped running: a schedule that stops firing altogether, and a run killed
# by the job timeout, which takes the notify step with it.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      max-age-hours:
        description: 'Hours a chart may sit behind prd before it counts as a finding'
        required: false
        default: '24'

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Full history: how long a chart has been behind is read by walking
          # Chart.yaml back to the last commit whose appVersion still matched
          # the tag prd runs. A shallow clone reaches no such commit and turns
          # every age into a lower bound.
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install PyYAML

      - name: Report charts behind values-prd.yaml
        id: report
        env:
          PRD_DRIFT_MAX_AGE_HOURS: ${{ github.event.inputs.max-age-hours || '24' }}
        run: |
          set -uo pipefail
          # `|| status=$?` rather than a pipeline: the default shell runs with
          # -e, so letting a non-zero check abort the step here would skip the
          # report it just produced and leave the job red with nothing in it.
          status=0
          python3 tools/check-prd-drift.py > report.txt || status=$?
          cat report.txt
          {
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 2 and anything above it mean the check reached no verdict, which is
          # a different failure from prd being behind and gets a different
          # audience below. The step itself stays green either way so that the
          # notification is sent before the job is allowed to end.
          case "$status" in
            0) outcome=level ;;
            1) outcome=drifted ;;
            *) outcome=no-verdict ;;
          esac
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Notify
        # always(): an empty outcome means the report step never got to run —
        # checkout or the dependency install failed — which is itself a check
        # that produced no verdict and has to be reported as one.
        if: always()
        env:
          OUTCOME: ${{ steps.report.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ "${OUTCOME:-}" = "level" ]; then
            echo "prd is level with every released appVersion — nothing to report."
            exit 0
          fi

          if [ "${OUTCOME:-}" = "drifted" ]; then
            severity=warning
            # The first line of the report is already a one-line count of every
            # grade, which is exactly what a summary annotation wants.
            summary="$(head -n 1 report.txt)"
            description="$(cat report.txt)"
          else
            severity=critical
            summary="prd Drift reached no verdict — drift detection against prd is blind"
            description="tools/check-prd-drift.py did not run to completion, so this run cannot say whether prd is behind. Until it does, nothing is watching the distance between released appVersions and values-prd.yaml."
          fi

          python3 tools/notify-alert.py \
            --alertname PrdPromotionDrift \
            --severity "$severity" \
            --summary "$summary" \
            --description "$description" \
            --label repo="${GITHUB_REPOSITORY}" \
            --label workflow="prd Drift" \
            --annotation runbook_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/prd-promotion.md#what-the-drift-check-covers" \
            --annotation run_url="${RUN_URL}"

      - name: Fail on a finding
        # The verdict is re-asserted here rather than in the report step so the
        # notification above is sent first. A red run remains the record in the
        # Actions tab; it is no longer the only place the result exists.
        env:
          OUTCOME: ${{ steps.report.outputs.outcome }}
          STATUS: ${{ steps.report.outputs.status }}
        run: |
          set -uo pipefail
          case "${OUTCOME:-}" in
            level)
              echo "0 issues — no chart has been behind values-prd.yaml for more than the threshold."
              ;;
            drifted)
              echo "::error::prd is behind the latest released version for one or more charts — see the report above."
              echo "Nothing promotes on its own today. Dispatch Promote PRD per app, or record why the gap stands"
              echo "in tools/prd-drift-holds.yaml so the next reader does not have to rediscover it."
              exit 1
              ;;
            *)
              echo "::error::tools/check-prd-drift.py exited ${STATUS:-<never ran>} without a verdict — see the log above."
              exit 1
              ;;
          esac
